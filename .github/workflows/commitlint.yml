# Lints every commit message in a pull request against Conventional Commits (B4).
name: Commit messages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          --to "${{ github.event.pull_request.head.sha || 'HEAD' }}"
          --verbose
